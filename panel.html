<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel – ECU-Perfect</title>
<meta name="robots" content="noindex">
<script src="i18n.js"></script>
<style>
  :root { --red:#e5202e; --red2:#ff4b57; --bg:#0b0b10; --card:#15151d; --line:#262633; --txt:#f2f2f6; --muted:#9a9aab; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,Arial,sans-serif; background:var(--bg); color:var(--txt); line-height:1.5; }
  a { color:inherit; }
  nav { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:rgba(11,11,16,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .logo { font-weight:800; letter-spacing:2px; text-decoration:none; } .logo b { color:inherit; }
  nav .links a { margin-left:20px; text-decoration:none; color:var(--muted); font-size:.95rem; } nav .links a:hover { color:var(--txt); }
  main { max-width:900px; margin:0 auto; padding:30px 20px 50px; }
  h1 { margin:0 0 6px; font-size:clamp(1.6rem,4.5vw,2.4rem); }
  h1::after { content:""; display:block; width:56px; height:3px; background:var(--red); margin-top:10px; border-radius:2px; }
  .lead { color:var(--muted); margin:14px 0 26px; max-width:760px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px; }
  .card h2 { margin:0 0 14px; font-size:1.05rem; }
  label { display:block; font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:12px 0 4px; }
  input[type=email], input[type=password] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f0f16; color:var(--txt); font-size:1.05rem; font-family:inherit; }
  select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f0f16; color:var(--txt); font-size:1.05rem; font-family:inherit; }
  select:focus { outline:2px solid var(--red); border-color:var(--red); }
  input[type=file] { width:100%; padding:10px 12px; border-radius:8px; border:1px dashed var(--line); background:#0f0f16; color:var(--txt); font-family:inherit; }
  input:focus { outline:2px solid var(--red); border-color:var(--red); }
  button { padding:10px 20px; border-radius:10px; border:2px solid var(--red); background:var(--red); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer; margin-top:14px; font-family:inherit; }
  button:hover { background:var(--red2); border-color:var(--red2); }
  button.ghost { background:transparent; color:var(--txt); border-color:var(--line); }
  button.ghost:hover { border-color:var(--red); background:transparent; }
  button.sm { margin-top:0; padding:6px 12px; font-size:.85rem; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .tabs { display:flex; gap:8px; margin-bottom:6px; }
  .tabs button { margin-top:0; }
  .tabs button.on { background:var(--red); border-color:var(--red); }
  .msg { min-height:1.2em; margin-top:12px; font-size:.92rem; color:var(--muted); }
  .msg.err { color:var(--red2); } .msg.ok { color:#5fd48a; }
  .small { color:var(--muted); font-size:.82rem; margin-top:14px; }
  .hidden { display:none; }
  .chk { display:flex; gap:10px; align-items:flex-start; text-transform:none; letter-spacing:0; font-size:.9rem; color:var(--txt); margin:12px 0 0; }
  .chk input { width:auto; margin-top:4px; }
  .notice { margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-left:3px solid var(--red); border-radius:8px; background:#0f0f16; color:var(--muted); font-size:.85rem; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .mbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; max-width:560px; width:100%; max-height:85vh; overflow:auto; }
  .mbox h2 { margin:0 0 12px; font-size:1.15rem; }
  .mbox p { margin:6px 0; color:var(--txt); }
  .hidden { display:none !important; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .tile h3 { margin:0; font-size:1.1rem; } .tile p { margin:0; color:var(--muted); font-size:.92rem; flex:1; }
  .tile:hover { border-color:var(--red); }
  .who { color:var(--muted); font-size:.9rem; }
  .applist { margin:8px 0 0 18px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:30px 20px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">ECU-<b>Perfect</b></a>
  <div class="links"><a href="admin.html" id="adminLink" class="hidden">Administrator</a><a href="index.html" id="homeLink">← Strona główna</a></div>
</nav>
<main>
<h1 id="hTitle">Panel</h1>
<p class="lead" id="hLead"></p>

<section id="authBox" class="card hidden">
  <button type="button" id="googleBtn" class="ghost hidden" style="width:100%"></button>
  <div id="orLine" class="small hidden" style="text-align:center;margin:12px 0 4px"></div>
  <div class="tabs">
    <button type="button" id="tabIn" class="on"></button>
    <button type="button" id="tabUp" class="ghost"></button>
  </div>
  <form id="authForm" autocomplete="on">
    <label for="em">E-mail</label>
    <input type="email" id="em" autocomplete="email" required>
    <label for="pw" id="pwLab"></label>
    <div style="position:relative">
      <input type="password" id="pw" autocomplete="current-password" minlength="8" style="padding-right:90px">
      <button type="button" id="pwToggle" class="ghost sm" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;background:var(--card);color:var(--txt);border:1px solid var(--line)"></button>
    </div>
    <label class="chk hidden" id="termsRow"><input type="checkbox" id="termsChk"><span id="termsText"></span></label>
    <div id="cap" style="margin-top:12px"></div>
    <div class="row" style="margin-top:14px">
      <button type="submit" id="authBtn" style="margin-top:0"></button>
      <button type="button" id="linkBtn" class="ghost" style="margin-top:0"></button>
      <button type="button" id="forgotBtn" class="ghost" style="margin-top:0"></button>
    </div>
  </form>
  <div id="authMsg" class="msg"></div>
  <div id="authNote" class="small" style="margin-top:6px"></div>
</section>

<section id="appBox" class="hidden">
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <span class="who"><span id="whoLab"></span> <b id="who"></b></span>
    <button type="button" id="outBtn" class="ghost sm"></button>
  </div>
  <h2 id="appsTitle" style="font-size:1.1rem;margin:6px 0 12px"></h2>
  <div class="tiles" id="tiles"></div>

  <div class="card" style="margin-top:26px">
    <div class="row" style="justify-content:space-between">
      <h2 id="tkTitle" style="margin:0"></h2>
      <button type="button" id="tkNew" style="margin-top:0"></button>
    </div>
    <div id="tkList" style="margin-top:10px"></div>
  </div>

  <div class="card" style="margin-top:26px">
    <h2 id="accTitle"></h2>
    <div id="pwBox" style="margin:4px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)">
      <div id="pwTitle" style="font-weight:700;margin-bottom:6px"></div>
      <div id="oldPwRow">
        <label for="oldPw" id="oldPwLab"></label>
        <div style="position:relative"><input type="password" id="oldPw" autocomplete="current-password" style="padding-right:90px"><button type="button" class="ghost sm eye" data-for="oldPw" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;background:var(--card);color:var(--txt);border:1px solid var(--line)"></button></div>
      </div>
      <label for="newPw" id="newPwLab"></label>
      <div style="position:relative"><input type="password" id="newPw" minlength="8" autocomplete="new-password" style="padding-right:90px"><button type="button" class="ghost sm eye" data-for="newPw" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;background:var(--card);color:var(--txt);border:1px solid var(--line)"></button></div>
      <label for="newPw2" id="newPw2Lab"></label>
      <div style="position:relative"><input type="password" id="newPw2" minlength="8" autocomplete="new-password" style="padding-right:90px"><button type="button" class="ghost sm eye" data-for="newPw2" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;background:var(--card);color:var(--txt);border:1px solid var(--line)"></button></div>
      <button type="button" id="pwBtn"></button>
      <div id="pwMsg" class="msg"></div>
    </div>
    <div id="accText" class="small" style="margin-top:0"></div>
    <button type="button" id="delAccBtn" class="ghost"></button>
    <div id="accMsg" class="msg"></div>
  </div>
</section>
</main>
<div id="modal" class="modal hidden"><div class="mbox">
  <h2 id="mTitle"></h2>
  <div id="mBody"></div>
  <label class="chk" id="mAckRow"><input type="checkbox" id="mAck"><span id="mAckText"></span></label>
  <div class="row" style="margin-top:16px">
    <button type="button" id="mOk"></button>
    <button type="button" class="ghost" id="mCancel"></button>
  </div>
</div></div>
<footer>&copy; ECU-Perfect · chiptuning · Wrocław</footer>

<script src="vendor/supabase.js"></script>
<script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');</script>
<script src="supabase-config.js"></script>
<script src="apps-config.js"></script>
<script src="ticket-widget.js"></script>
<script>
(function () {
  var cfg = window.ECUP_SUPABASE;
  var sb = window.supabase.createClient(cfg.url, cfg.key);
  var APPS = window.ECUP_APPS || [];
  var mode = 'in', loggedIn = false, pwRecovery = false;

  function $(id) { return document.getElementById(id); }
  function tr(pl, en) { return window.I18N ? I18N.t(pl, en) : pl; }
  function L(o) { return o ? tr(o.pl, o.en) : ''; }
  function say(id, text, cls) { var e = $(id); e.textContent = text || ''; e.className = 'msg' + (cls ? ' ' + cls : ''); }

  function buildTexts() {
    document.title = tr('Panel – ECU-Perfect', 'Panel - ECU-Perfect');
    $('hTitle').textContent = tr('Panel ECU-Perfect', 'ECU-Perfect panel');
    $('hLead').textContent = loggedIn ? tr('Wybierz aplikację. Na dole ustawienia konta.', 'Choose an application. Account settings are at the bottom.')
                                      : tr('Zaloguj się albo załóż konto, aby korzystać z aplikacji ECU-Perfect.', 'Log in or create an account to use the ECU-Perfect applications.');
    $('homeLink').textContent = tr('← Strona główna', '← Home page');
    $('googleBtn').textContent = tr('Zaloguj przez Google', 'Log in with Google');
    $('orLine').textContent = tr('lub e-mailem', 'or by e-mail');
    $('tabIn').textContent = tr('Logowanie', 'Log in');
    $('tabUp').textContent = tr('Rejestracja', 'Sign up');
    $('pwLab').innerHTML = '';
    $('pwLab').appendChild(document.createTextNode(tr('Hasło ', 'Password ')));
    var sp = document.createElement('span'); sp.style.cssText = 'text-transform:none;letter-spacing:0';
    sp.textContent = tr('(min. 8 znaków)', '(min. 8 characters)'); $('pwLab').appendChild(sp);
    $('linkBtn').textContent = tr('Wyślij link logowania (bez hasła)', 'Send a login link (no password)');
    $('forgotBtn').textContent = tr('Nie pamiętam hasła', 'Forgot password');
    $('authBtn').textContent = mode === 'in' ? tr('Zaloguj', 'Log in') : tr('Załóż konto', 'Create account');
    $('whoLab').textContent = tr('Zalogowano jako', 'Logged in as');
    $('outBtn').textContent = tr('Wyloguj', 'Log out');
    $('appsTitle').textContent = tr('Aplikacje', 'Applications');
    $('tkTitle').textContent = tr('Moje zgłoszenia', 'My tickets');
    $('tkNew').textContent = tr('Zgłoś problem', 'Report a problem');
    $('accTitle').textContent = tr('Konto', 'Account');
    $('pwTitle').textContent = tr('Zmiana hasła', 'Change password');
    $('oldPwLab').textContent = tr('Obecne hasło', 'Current password');
    $('newPwLab').textContent = tr('Nowe hasło (min. 8 znaków)', 'New password (min. 8 characters)');
    $('newPw2Lab').textContent = tr('Powtórz nowe hasło', 'Repeat the new password');
    $('pwBtn').textContent = tr('Zmień hasło', 'Change password');
    $('accText').textContent = tr('Usunięcie konta usuwa trwale wszystkie Twoje dane we wszystkich aplikacjach ECU-Perfect.', 'Deleting the account permanently removes all your data in all ECU-Perfect applications.');
    $('delAccBtn').textContent = tr('Usuń konto', 'Delete account');
    buildTerms(); buildFooter(); buildTiles(); syncEyes();
  }

  // ---------------- application tiles
  function buildTiles() {
    var box = $('tiles'); box.innerHTML = '';
    APPS.forEach(function (a) {
      var t = document.createElement('div'); t.className = 'tile';
      var h = document.createElement('h3'); h.textContent = L(a.name);
      var p = document.createElement('p'); p.textContent = L(a.desc);
      var b = document.createElement('button'); b.type = 'button'; b.textContent = tr('Otwórz', 'Open'); b.style.marginTop = '4px';
      b.onclick = function () { openApp(a); };
      t.appendChild(h); t.appendChild(p); t.appendChild(b); box.appendChild(t);
    });
  }
  async function openApp(a) {
    // the application runs on its own address: it gets the session in the address fragment (never sent to a server)
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return;
    window.open(a.url + '#access_token=' + encodeURIComponent(s.access_token) + '&refresh_token=' + encodeURIComponent(s.refresh_token), '_blank', 'noopener');
  }
  async function appCall(a, op, extra) {
    var s = (await sb.auth.getSession()).data.session;
    var r = await fetch(a.api, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
                                 body: JSON.stringify(Object.assign({ op: op }, extra || {})) });
    var j = await r.json();
    if (!j.ok) throw new Error((j.messages && j.messages[0] && tr(j.messages[0].pl, j.messages[0].en)) || 'error');
    return j.data;
  }

  // ---------------- terms, footer
  function legalLinks() {
    var a = document.createElement('a'); a.href = 'regulamin.html'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = tr('Regulamin', 'Terms of service');
    var b = document.createElement('a'); b.href = 'polityka-prywatnosci.html'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = tr('Politykę prywatności', 'Privacy policy');
    return [a, b];
  }
  function buildTerms() {
    var t = $('termsText'); t.textContent = '';
    var l = legalLinks();
    t.appendChild(document.createTextNode(tr('Akceptuję ', 'I accept the '))); t.appendChild(l[0]);
    t.appendChild(document.createTextNode(tr(' i ', ' and the '))); t.appendChild(l[1]); t.appendChild(document.createTextNode('.'));
    var n = $('authNote'); n.textContent = '';
    var l2 = legalLinks();
    n.appendChild(document.createTextNode(tr('Korzystając z panelu, akceptujesz ', 'By using the panel you accept the '))); n.appendChild(l2[0]);
    n.appendChild(document.createTextNode(tr(' i ', ' and the '))); n.appendChild(l2[1]); n.appendChild(document.createTextNode('.'));
  }
  function buildFooter() {
    var f = document.querySelector('footer'); if (!f) return;
    var old = $('legalFooter'); if (old) old.remove();
    var d = document.createElement('div'); d.id = 'legalFooter'; d.style.marginTop = '6px';
    var l = legalLinks(); l[0].target = '_self'; l[1].target = '_self'; l[1].textContent = tr('Polityka prywatności', 'Privacy policy');
    d.appendChild(l[0]); d.appendChild(document.createTextNode(' · ')); d.appendChild(l[1]); f.appendChild(d);
  }
  function rememberTerms(method) { try { localStorage.setItem('ecup_terms', JSON.stringify({ v: 'v1', method: method })); } catch (e) {} }
  function recordTerms(uid) {
    var raw = null;
    try { raw = localStorage.getItem('ecup_terms'); localStorage.removeItem('ecup_terms'); } catch (e) {}
    if (!raw) return;
    var m = 'unknown'; try { m = JSON.parse(raw).method || m; } catch (e) {}
    sb.from('consents').insert([
      { user_id: uid, kind: 'terms', version: 'v1', details: { method: m } },
      { user_id: uid, kind: 'privacy', version: 'v1', details: { method: m } }
    ]);
  }
  function needTerms() {
    if (mode === 'up' && !$('termsChk').checked) {
      say('authMsg', tr('Aby założyć konto, zaakceptuj Regulamin i Politykę prywatności.', 'To create an account, accept the Terms of service and the Privacy policy.'), 'err');
      return true;
    }
    return false;
  }

  // ---------------- modal
  function confirmBox(o) {
    return new Promise(function (resolve) {
      $('mTitle').textContent = o.title;
      var b = $('mBody'); b.innerHTML = '';
      o.lines.forEach(function (l) { if (l && l.nodeType) { b.appendChild(l); return; } var p = document.createElement('p'); p.textContent = l; b.appendChild(p); });
      $('mAckRow').className = o.ack ? 'chk' : 'chk hidden';
      $('mAck').checked = false; $('mAckText').textContent = o.ack || '';
      $('mOk').className = o.ok ? '' : 'hidden'; $('mOk').textContent = o.ok || ''; $('mOk').disabled = !!o.ack;
      $('mCancel').textContent = o.cancel;
      $('modal').className = 'modal';
      function close(v) { $('modal').className = 'modal hidden'; $('mOk').onclick = $('mCancel').onclick = $('mAck').onchange = null; resolve(v); }
      $('mAck').onchange = function () { $('mOk').disabled = !$('mAck').checked; };
      $('mOk').onclick = function () { close(true); };
      $('mCancel').onclick = function () { close(false); };
    });
  }

  // ---------------- session
  function setMode(m) {
    mode = m;
    $('tabIn').className = m === 'in' ? 'on' : 'ghost';
    $('tabUp').className = m === 'up' ? 'on' : 'ghost';
    $('pw').autocomplete = m === 'in' ? 'current-password' : 'new-password';
    $('termsRow').className = m === 'up' ? 'chk' : 'chk hidden';
    $('forgotBtn').className = m === 'in' ? 'ghost' : 'ghost hidden';
    buildTexts(); say('authMsg', '');
  }
  async function checkAdmin() {
    var r = await sb.rpc('is_admin');
    $('adminLink').className = !r.error && r.data ? '' : 'hidden';
  }
  function show(session) {
    loggedIn = !!session;
    $('authBox').className = session ? 'card hidden' : 'card';
    $('appBox').className = session ? '' : 'hidden';
    if (session) { recordTerms(session.user.id); $('who').textContent = session.user.email; checkAdmin(); startTickets(); }
    else $('adminLink').className = 'hidden';
    buildTexts();
  }

  // ---------------- tickets ("Zgłoś problem"); link from an app: panel.html#ticket=gearbox,<project id>
  var ticketsReady = false;
  function startTickets() {
    if (!window.ECUP_TICKETS) return;
    if (!ticketsReady) {
      ECUP_TICKETS.init({ sb: sb, apps: APPS });
      $('tkNew').onclick = function () { ECUP_TICKETS.openForm({}); };
      ticketsReady = true;
      var m = /[#&]ticket=([^&]*)/.exec(location.hash || '');
      if (m) {
        var p = decodeURIComponent(m[1]).split(',');
        history.replaceState(null, '', location.pathname + location.search);
        ECUP_TICKETS.openForm({ app: (p[0] || '').toLowerCase(), docRef: p.slice(1).join(',').slice(0, 100) });
      }
    }
    ECUP_TICKETS.renderList($('tkList'));
  }

  // ---------------- account deletion: data of every application first, then the account (worker)
  async function deleteAccount() {
    say('accMsg', tr('Sprawdzanie danych w aplikacjach...', 'Checking the data in the applications...'));
    var info = [], failed = [];
    for (var i = 0; i < APPS.length; i++) {
      var a = APPS[i]; if (!a.api) continue;
      try { var d = await appCall(a, 'account_info'); info.push({ app: a, n: d.projects + (d.deleted || 0) }); }
      catch (e) { failed.push(a); }
    }
    say('accMsg', '');
    if (failed.length) {
      say('accMsg', tr('Nie udało się połączyć z aplikacją: ', 'Could not reach the application: ') + failed.map(function (a) { return L(a.name); }).join(', ') +
        tr('. Konta nie usunięto, żeby nie zostały po nim dane. Spróbuj później.', '. The account was not deleted so that no data is left behind. Try again later.'), 'err');
      return;
    }
    var ul = document.createElement('ul'); ul.className = 'applist';
    info.forEach(function (x) { var li = document.createElement('li'); li.textContent = L(x.app.name) + ': ' + (x.n ? tr('projekty: ', 'projects: ') + x.n : tr('brak danych', 'no data')); ul.appendChild(li); });
    var ok = await confirmBox({
      title: tr('Usunąć konto?', 'Delete the account?'),
      lines: [
        tr('Usunięte zostaną trwale wszystkie Twoje dane we wszystkich aplikacjach ECU-Perfect:', 'All your data in all ECU-Perfect applications will be permanently deleted:'),
        ul,
        tr('Tej operacji nie można cofnąć. Jeśli chcesz zachować swoje pliki, najpierw pobierz je w aplikacjach (np. „Pobierz wszystko (ZIP)” w edytorze skrzyń).', 'This cannot be undone. If you want to keep your files, download them in the applications first (e.g. "Download all (ZIP)" in the gearbox editor).')
      ],
      ack: tr('Rozumiem i chcę trwale usunąć konto oraz wszystkie moje dane.', 'I understand and want to permanently delete my account and all my data.'),
      ok: tr('Usuń konto', 'Delete account'), cancel: tr('Anuluj', 'Cancel')
    });
    if (!ok) return;
    $('delAccBtn').disabled = true;
    say('accMsg', tr('Usuwanie danych w aplikacjach...', 'Deleting the data in the applications...'));
    for (var j = 0; j < info.length; j++) {
      try { await appCall(info[j].app, 'delete_my_data'); }
      catch (e) { $('delAccBtn').disabled = false; say('accMsg', L(info[j].app.name) + ': ' + e.message, 'err'); return; }
    }
    say('accMsg', tr('Usuwanie konta...', 'Deleting the account...'));
    var r = await sb.rpc('request_account_deletion');
    if (r.error) {
      $('delAccBtn').disabled = false;
      say('accMsg', r.error.message.indexOf('admin_cannot_delete') >= 0 ? tr('Konta administratora nie można usunąć z panelu.', 'An administrator account cannot be deleted from the panel.') : r.error.message, 'err');
      return;
    }
    var uid = (await sb.auth.getSession()).data.session.user.id;
    for (var k = 0; k < 120; k++) {
      await new Promise(function (res) { setTimeout(res, 1000); });
      var q = await sb.from('account_deletions').select('status,error').eq('user_id', uid);
      if (q.error) break;
      if (!q.data.length) { await sb.auth.signOut(); return; }
      if (q.data[0].status === 'error') { $('delAccBtn').disabled = false; say('accMsg', tr('Nie udało się usunąć konta. Spróbuj ponownie lub skontaktuj się z administratorem.', 'The account could not be deleted. Try again or contact the administrator.'), 'err'); return; }
    }
    await sb.auth.signOut();
  }
  $('delAccBtn').onclick = deleteAccount;

  // ---------------- password fields
  function syncPwToggle() { var shown = $('pw').type === 'text'; $('pwToggle').textContent = shown ? tr('Ukryj', 'Hide') : tr('Pokaż', 'Show'); }
  $('pwToggle').onclick = function () { $('pw').type = $('pw').type === 'text' ? 'password' : 'text'; syncPwToggle(); };
  function syncEyes() {
    syncPwToggle();
    Array.prototype.forEach.call(document.querySelectorAll('button.eye'), function (b) {
      b.textContent = $(b.getAttribute('data-for')).type === 'text' ? tr('Ukryj', 'Hide') : tr('Pokaż', 'Show');
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('button.eye'), function (b) {
    b.onclick = function () { var i = $(b.getAttribute('data-for')); i.type = i.type === 'text' ? 'password' : 'text'; syncEyes(); };
  });

  $('tabIn').onclick = function () { setMode('in'); };
  $('tabUp').onclick = function () { setMode('up'); };
  $('outBtn').onclick = async function () { await sb.auth.signOut(); };
  function redirectUrl() { return location.origin + location.pathname; }

  fetch(cfg.url + '/auth/v1/settings', { headers: { apikey: cfg.key } })
    .then(function (r) { return r.json(); })
    .then(function (st) { var on = !!(st && st.external && st.external.google);
      $('googleBtn').className = on ? 'ghost' : 'ghost hidden'; $('orLine').className = on ? 'small' : 'small hidden'; })
    .catch(function () {});
  $('googleBtn').onclick = async function () {
    if (needTerms()) return;
    rememberTerms('google');
    var r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl() } });
    if (r.error) say('authMsg', r.error.message, 'err');
  };

  var capKey = (window.ECUP_SUPABASE || {}).captchaSiteKey || '', capId = null, capTok = '';
  function initCaptcha() {
    if (!capKey) return;
    var s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.async = true;
    s.onload = function () { capId = window.turnstile.render('#cap', { sitekey: capKey, theme: 'dark', callback: function (t) { capTok = t; }, 'expired-callback': function () { capTok = ''; } }); };
    document.head.appendChild(s);
  }
  function needCaptcha() {
    if (!capKey || capTok) return false;
    say('authMsg', tr('Potwierdź, że nie jesteś robotem.', 'Please confirm you are not a robot.'), 'err'); return true;
  }
  function capReset() { capTok = ''; if (capId !== null && window.turnstile) window.turnstile.reset(capId); }

  $('linkBtn').onclick = async function () {
    var email = $('em').value.trim();
    if (!email) { say('authMsg', tr('Wpisz adres e-mail.', 'Enter your e-mail address.'), 'err'); return; }
    if (needTerms() || needCaptcha()) return;
    rememberTerms('link');
    $('linkBtn').disabled = true;
    var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirectUrl(), captchaToken: capTok || undefined } });
    capReset(); $('linkBtn').disabled = false;
    if (r.error) { say('authMsg', r.error.message, 'err'); return; }
    say('authMsg', tr('Wysłaliśmy link logowania. Sprawdź skrzynkę e-mail.', 'We sent you a login link. Check your inbox.'), 'ok');
  };
  $('forgotBtn').onclick = async function () {
    var email = $('em').value.trim();
    if (!email) { say('authMsg', tr('Wpisz adres e-mail.', 'Enter your e-mail address.'), 'err'); return; }
    if (needCaptcha()) return;
    $('forgotBtn').disabled = true;
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl(), captchaToken: capTok || undefined });
    capReset(); $('forgotBtn').disabled = false;
    if (r.error) { say('authMsg', r.error.message, 'err'); return; }
    say('authMsg', tr('Jeśli konto o tym adresie istnieje, wysłaliśmy link do ustawienia nowego hasła. Sprawdź skrzynkę (także Spam).', 'If an account with this address exists, we sent a link to set a new password. Check your inbox (and Spam).'), 'ok');
  };
  $('pwBtn').onclick = async function () {
    var a = $('newPw').value, b = $('newPw2').value;
    if (a.length < 8) { say('pwMsg', tr('Hasło musi mieć co najmniej 8 znaków.', 'The password must have at least 8 characters.'), 'err'); return; }
    if (a !== b) { say('pwMsg', tr('Hasła nie są takie same.', 'The passwords do not match.'), 'err'); return; }
    $('pwBtn').disabled = true;
    if (!pwRecovery) {
      var v = await sb.rpc('verify_my_password', { p_password: $('oldPw').value });
      if (v.error || !v.data) {
        $('pwBtn').disabled = false;
        var tooMany = v.error && String(v.error.message).indexOf('too_many_attempts') >= 0;
        say('pwMsg', tooMany ? tr('Zbyt wiele nieudanych prób. Spróbuj ponownie za godzinę albo użyj „Nie pamiętam hasła”.', 'Too many failed attempts. Try again in an hour or use "Forgot password".') : v.error ? v.error.message : tr('Obecne hasło jest nieprawidłowe.', 'The current password is incorrect.'), 'err');
        return;
      }
    }
    var r = await sb.auth.updateUser({ password: a });
    $('pwBtn').disabled = false;
    if (r.error) { say('pwMsg', r.error.code === 'same_password' ? tr('Nowe hasło musi być inne niż obecne.', 'The new password must be different from the current one.') : r.error.message, 'err'); return; }
    $('oldPw').value = ''; $('newPw').value = ''; $('newPw2').value = '';
    pwRecovery = false; $('oldPwRow').className = '';
    say('pwMsg', tr('Hasło zostało zmienione.', 'Your password has been changed.'), 'ok');
  };
  $('authForm').onsubmit = async function (e) {
    e.preventDefault();
    var email = $('em').value.trim(), pass = $('pw').value;
    if (pass.length < 8) { say('authMsg', tr('Hasło musi mieć co najmniej 8 znaków. Możesz też użyć linku logowania lub Google.', 'The password must have at least 8 characters. You can also use the login link or Google.'), 'err'); return; }
    if (needTerms() || needCaptcha()) return;
    if (mode === 'up') rememberTerms('password');
    $('authBtn').disabled = true; say('authMsg', '');
    var co = { captchaToken: capTok || undefined };
    var r = mode === 'in' ? await sb.auth.signInWithPassword({ email: email, password: pass, options: co })
                          : await sb.auth.signUp({ email: email, password: pass, options: co });
    capReset(); $('authBtn').disabled = false;
    if (r.error) { try { localStorage.removeItem('ecup_terms'); } catch (x) {} say('authMsg', r.error.message, 'err'); return; }
    if (mode === 'up' && !r.data.session) say('authMsg', tr('Sprawdź skrzynkę e-mail i potwierdź konto.', 'Check your inbox and confirm your account.'), 'ok');
  };

  var recovering = false;
  sb.auth.onAuthStateChange(function (ev, session) {
    if (ev === 'PASSWORD_RECOVERY') recovering = true;
    setTimeout(function () {
      show(session);
      if (recovering && session) {
        recovering = false; pwRecovery = true; $('oldPwRow').className = 'hidden';
        say('pwMsg', tr('Ustaw nowe hasło poniżej.', 'Set your new password below.'), 'ok');
        $('pwBox').scrollIntoView({ block: 'center' }); $('newPw').focus();
      }
    }, 0);
  });
  sb.auth.getSession().then(async function (r) {
    if (r.data.session) { var v = await sb.auth.getUser(); if (v.error) { await sb.auth.signOut(); return; } }
    show(r.data.session);
  });
  setMode('in');
  initCaptcha();
  if (window.I18N && I18N.onChange) I18N.onChange(buildTexts);
})();
</script>
</body>
</html>
